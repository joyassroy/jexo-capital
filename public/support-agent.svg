<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#003e99" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4" />
      <stop offset="100%" stop-color="#F0B27A" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50" />
      <stop offset="100%" stop-color="#1A252F" />
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)" />
  <circle cx="100" cy="100" r="95" fill="#f0f7ff" />

  <!-- Body / Suit -->
  <path d="M 40 200 C 40 155 70 140 100 140 C 130 140 160 155 160 200 Z" fill="url(#suit)" />
  <polygon points="100,140 85,170 115,170" fill="#FFFFFF" />
  <polygon points="97,148 103,148 102,175 98,175" fill="url(#accent)" />

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="26" rx="6" fill="url(#skin)" />

  <!-- Head -->
  <ellipse cx="100" cy="85" rx="36" ry="42" fill="url(#skin)" />

  <!-- Hair -->
  <path d="M 64 85 C 64 50 80 40 100 40 C 120 40 136 50 136 85 C 136 90 134 70 125 58 C 115 50 85 50 75 58 C 66 70 64 90 64 85 Z" fill="url(#hair)" />
  <path d="M 64 78 C 64 60 76 48 100 48 C 116 48 132 58 136 78 C 130 68 118 62 100 62 C 82 62 70 68 64 78 Z" fill="#1A252F" />

  <!-- Eyes -->
  <ellipse cx="88" cy="86" rx="3.5" ry="4.5" fill="#2C3E50" />
  <ellipse cx="112" cy="86" rx="3.5" ry="4.5" fill="#2C3E50" />
  <circle cx="89.5" cy="84.5" r="1.5" fill="#FFFFFF" />
  <circle cx="113.5" cy="84.5" r="1.5" fill="#FFFFFF" />

  <!-- Eyebrows -->
  <path d="M 83 77 Q 89 74 94 77" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 106 77 Q 111 74 117 77" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M 92 102 Q 100 110 108 102" stroke="#E74C3C" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Cheeks -->
  <ellipse cx="78" cy="94" rx="4" ry="2.5" fill="#FF8A80" opacity="0.4" />
  <ellipse cx="122" cy="94" rx="4" ry="2.5" fill="#FF8A80" opacity="0.4" />

  <!-- Headset band -->
  <path d="M 60 85 A 42 42 0 0 1 140 85" stroke="#38BDF8" stroke-width="4.5" fill="none" stroke-linecap="round" />
  <!-- Ear pads -->
  <rect x="56" y="76" width="9" height="20" rx="4.5" fill="#0284C7" />
  <rect x="135" y="76" width="9" height="20" rx="4.5" fill="#0284C7" />

  <!-- Microphone arm and mic -->
  <path d="M 60 92 Q 62 110 88 112" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="90" cy="112" r="5" fill="#0284C7" />
  <circle cx="90" cy="112" r="3" fill="#38BDF8" />
</svg>
